    <script>
      (() => {
        const reader = document.getElementById("abyss-reader");
        const prev = document.getElementById("abyss-prev");
        const next = document.getElementById("abyss-next");
        const counter = document.getElementById("abyss-counter");
        if (!reader || !prev || !next || !counter) return;

        let audioCtx = null;
        const playPageTurn = async (dir) => {
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state !== "running") await audioCtx.resume();
          } catch {
            return;
          }

          const t0 = audioCtx.currentTime;
          const dur = 0.09;

          const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
          const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) {
            const n = Math.random() * 2 - 1;
            const env = Math.pow(1 - i / bufSize, 1.35);
            data[i] = n * env * 0.95;
          }

          const src = audioCtx.createBufferSource();
          src.buffer = buf;

          const hp = audioCtx.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.setValueAtTime(900, t0);

          const bp = audioCtx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.setValueAtTime(dir < 0 ? 2200 : 2600, t0);
          bp.Q.setValueAtTime(1.1, t0);

          const g = audioCtx.createGain();
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

          const click = audioCtx.createOscillator();
          click.type = "square";
          click.frequency.setValueAtTime(dir < 0 ? 1650 : 2050, t0);
          const cg = audioCtx.createGain();
          cg.gain.setValueAtTime(0.0001, t0);
          cg.gain.exponentialRampToValueAtTime(0.035, t0 + 0.004);
          cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.035);
          click.connect(cg);
          cg.connect(g);

          src.connect(hp);
          hp.connect(bp);
          bp.connect(g);
          g.connect(audioCtx.destination);

          src.start(t0);
          click.start(t0);
          src.stop(t0 + dur + 0.02);
          click.stop(t0 + 0.05);
        };

        const pages = [
          {
            html: `

            html: `
              <h3>引言</h3>
              <p>在常规收容手段——信息管制、叙事替代、开放竞争、平台删除——全部以失败告终之后，███研究中心进入了一段不再以“收容”为目标的时期。</p>
              <p>此时期的核心假设是：既然异常以恐惧叙事为营养，那么是否存在某种手段，可以切断营养供给，或反过来利用营养供给机制毒杀异常，或在供给端制造某种异常无法消化或消化后自我毁灭的物质？</p>
              <p>以下为这一时期的研究记录。所有实验均未取得预期效果。所有实验均造成了不可逆的后果。</p>
              <p class="small">研究代号被有意从档案中删除。以下记录中的代号均为保存人根据实验内容自行标注。</p>
            `,
          },
          {
            html: `
              <h3>绝境研究一：空白叙事</h3>
              <div class="abyss__meta">
                <div class="k"><strong>代号</strong>：BLANK-SCRIPT-01</div>
                <div class="k"><strong>时间</strong>：198█年█月至198█年█月</div>
                <div class="k"><strong>地点</strong>：██████</div>
              </div>
              <h3>假设</h3>
              <p>异常依赖恐惧叙事传播。恐惧叙事依赖人类产生。如果彻底切断人类接触恐惧叙事的渠道，异常是否将因营养断绝而衰竭？</p>
              <h3>实验设计</h3>
              <p>从全球范围内筛选120名受试者。筛选标准：高叙事敏感度、既往有焦虑障碍史、无紧密社会关系。</p>
              <p>受试者被分为四组，每组30人。全部受试者在不知情的情况下被转移至地下隔离设施，每人单间，房间隔音，无窗，24小时照明。</p>
              <p>A组（完全叙事剥夺）：房间内无任何可被解读为叙事的物品。墙壁为均匀灰色。食物为营养糊剂，无形状无气味。无声音。无文字。无图像。受试者之间完全隔离。每日通过管道输送食物。无人与其交谈。</p>
              <p>B组（无恐惧叙事）：房间内提供经筛选的叙事材料——纯描述性文本（气象报告、几何学教材、零件目录）。所有材料经五人小组逐句审核，确保不含任何可被解读为威胁、冲突、悬念或情绪波动的内容。</p>
              <p>C组（叙事充盈对照）：房间内提供正常图书、电视、广播。内容未经筛选。允许受试者自由阅读和观看。</p>
              <p>D组（恐惧叙事饱和）：房间内只提供恐惧叙事材料——恐怖小说、灾难纪录片、犯罪报道、民间恐怖故事集。每日更新。全部为未定义威胁型或威胁未解除型叙事。</p>
              <p>实验周期：六个月。受试者在进入前被告知将参与一项“封闭环境下的认知适应研究”，自愿签署知情同意书。知情同意书未告知隔离的真实性质。</p>
            `,

              <h3>结果</h3>
              <p>A组：第3日，受试者开始出现自发言语增多。受试者对自己说话。第7日，30人全部出现不同程度的自发叙事生产——受试者开始给自己讲故事。有受试者开始对墙壁讲述自己童年的经历。有受试者编造了一个关于“外面那些人为什么要把我关在这里”的叙事。该叙事在无任何外部信息输入的情况下自发产生。第21日，一名受试者用指甲在墙壁上刻下第一行字：“他们在看着我。”该句被刻在没有任何监控摄像头的墙壁上。</p>

            `,

          {
            html: `
              <h3>实验结论</h3>
              <p>完全剥夺叙事，人类大脑将自发生产叙事填补空白。无法依靠剥夺来断绝异常的营养供给。剥夺创造空白，空白催生新叙事。新叙事以最快的速度变更为恐惧叙事——实验中被关在灰色房间里的受试者，他们编造的第一个故事无一例外是关于“为什么我被关在这里”的。</p>
              <p>提供无恐惧叙事，人类大脑将恐惧解读进无恐惧的材料中。恐惧不是内容。恐惧是解读方式。</p>

            `,

              <h3>背景</h3>
